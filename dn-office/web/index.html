<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Clients, jobs, quotes and payments for Debug Networks, Hazaribagh.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DN Office">
<title>DN Office</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&amp;family=Sora:wght@400;600;700;800&amp;display=swap">
<style>
/* Layout: a phone app for one person running a CCTV business. A navy app bar names the section,
   a bottom menu switches between Today, Jobs, Clients, Goal and Settings, and a honey + button
   starts a quote, job or client. Records, quotes and payments open as full-screen pages. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#D8DEE9; --grid:#E6EAF1;
  --fg:#0A1F44; --muted:#55647D; --accent:#F5B400; --accent-soft:#FDF0D5; --track:#FBE7A6;
  --primary:#0A1F44; --on-primary:#FFFFFF; --danger:#B3261E; --focus:#2456D6; --link:#2148A8;
  --bar:#0A1F44; --on-bar:#FFFFFF; --on-bar-muted:#C9D6EA; --go:#1FB96C; --on-go:#04210F;
  --gray-bg:#EBEEF4; --gray-fg:#46546B; --blue-bg:#E3ECFF; --blue-fg:#2148A8;
  --amber-bg:#FDF0D5; --amber-fg:#8A5200; --green-bg:#E3F4EA; --green-fg:#1E7F4F;
  --red-bg:#FBE4E2; --red-fg:#A52A1F; --scrim:rgba(10,31,68,.45); --shadow:rgba(10,31,68,.22);
  --font-display:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-data:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#07111F; --surface:#0E1C33; --surface-2:#132544; --line:#2A426D; --grid:#1D3156;
    --fg:#EAF0FA; --muted:#A6B6D0; --accent-soft:#3A2E12; --track:#3D3418; --primary:#F5B400; --on-primary:#0A1F44;
    --danger:#FF8A80; --focus:#9DBBFF; --link:#9DBBFF; --bar:#0B1830; --go:#2BD785; --on-go:#04210F;
    --gray-bg:#1C2D4D; --gray-fg:#C3CFE3; --blue-bg:#16305E; --blue-fg:#A9C4FF;
    --amber-bg:#3A2E12; --amber-fg:#F5C451; --green-bg:#12342A; --green-fg:#5AD69A;
    --red-bg:#3E1C1A; --red-fg:#FF9C93; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-display);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
a{color:var(--link)}
[hidden]{display:none !important}

.appbar{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--on-bar);display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px))}
.mark{flex:0 0 38px;width:38px;height:38px;border-radius:10px;background:#FFFFFF;display:grid;place-items:center}
.appbar-t{display:flex;flex-direction:column;min-width:0}
.appbar h1{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.appbar small{font-size:12px;color:var(--on-bar-muted)}

main{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(112px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding:6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px))}
.navbtn{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center}
.navbtn .ico{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.navbtn svg{width:23px;height:23px}
.navbtn[aria-current="page"]{color:var(--fg)}
.navbtn[aria-current="page"] .ico{background:var(--accent-soft)}
.navbtn:focus-visible .ico{outline:2px solid var(--focus)}
.fab{position:fixed;z-index:21;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(80px + env(safe-area-inset-bottom, 0px));width:58px;height:58px;border-radius:18px;border:0;
  background:#F5B400;color:#0A1F44;box-shadow:0 6px 18px var(--shadow);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tile[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 -4px 0 var(--accent)}
.tile span:first-child{font-size:12.5px;color:var(--muted)}
.tile strong{font-size:22px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tile small{font-size:11.5px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel > h2{font-size:16px;font-weight:700}
.banner{background:var(--accent-soft);border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px}
.banner > div{display:flex;flex-direction:column;gap:2px;flex:1 1 220px;min-width:0}
.banner span{font-size:13.5px}
.goal-fig{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px}
.goal-fig strong{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.meter{position:relative;height:12px;border-radius:999px;background:var(--track)}
.meter-fill{height:100%;border-radius:999px;background:var(--accent)}
.meter-tick{position:absolute;top:-4px;width:2px;height:20px;background:var(--fg);border-radius:1px}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:11.5px;color:var(--muted)}.stat strong{font-size:15px;overflow-wrap:anywhere}

.list{display:flex;flex-direction:column;gap:10px}
.section-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.item-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.item-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.linkish{all:unset;cursor:pointer;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.linkish:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.money{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:0 0 auto;text-align:right}
.money strong{font-size:17px}
.money span{font-size:11.5px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:16px;padding:18px;background:var(--surface)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-gray{background:var(--gray-bg);color:var(--gray-fg)}.p-blue{background:var(--blue-bg);color:var(--blue-fg)}
.p-amber{background:var(--amber-bg);color:var(--amber-fg)}.p-green{background:var(--green-bg);color:var(--green-fg)}
.p-red{background:var(--red-bg);color:var(--red-fg)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;min-height:42px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg)}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-go{background:var(--go);color:var(--on-go);border-color:var(--go)}
.btn-danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;min-height:36px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

input[type="text"],input[type="tel"],input[type="email"],input[type="number"],input[type="date"],input[type="search"],input[type="url"],select,textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:46px;font-size:16px}
textarea{resize:vertical;line-height:1.5}
input[type="number"]{font-family:var(--font-data);font-variant-numeric:tabular-nums}
input[type="checkbox"]{width:20px;height:20px;accent-color:var(--primary);flex:0 0 auto;margin:1px 0 0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1 / -1}
.f > span{font-size:12px;font-weight:600;color:var(--muted)}
@media (max-width:420px){ .grid{grid-template-columns:minmax(0,1fr)} .grid .half{grid-column:auto} }
.hint{font-size:13px;color:var(--muted)}
.msg{font-size:13px;color:var(--danger)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--grid)}
table.t .r{text-align:right}
.kv{display:grid;grid-template-columns:minmax(0,112px) minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

dialog.sheet{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--fg);overflow-y:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:var(--scrim)}
@media (min-width:760px){ dialog.sheet{width:min(640px,100%);margin:0 0 0 auto} }
dialog.sheet.mini{top:auto;bottom:0;height:auto;max-height:90%;margin:0;border-radius:22px 22px 0 0;background:var(--surface)}
@media (min-width:760px){ dialog.sheet.mini{width:min(460px,100%);bottom:24px;margin:0 auto;border-radius:22px} }
.sheet-top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px))}
.sheet-top h2{font-size:18px;font-weight:800;letter-spacing:-.3px;overflow-wrap:anywhere;flex:1 1 auto}
.mini .sheet-top{position:static;border-bottom:0;padding:16px 16px 4px}
.iconbtn{all:unset;cursor:pointer;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:24px;height:24px}
.iconbtn:focus-visible{outline:2px solid var(--focus)}
.sheet-in{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet-actions{position:sticky;bottom:0;z-index:2;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet-actions .btn{flex:1 1 0;min-width:96px;padding-inline:8px}
.bigopt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.bigopt b{display:block;font-size:16px}.bigopt span{font-size:13px;color:var(--muted)}
.bigopt .dot{flex:0 0 42px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft)}
.bigopt:focus-visible{outline:2px solid var(--focus)}
.mini-list{display:flex;flex-direction:column;gap:6px}
.mini-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qitem{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qfoot output{font-family:var(--font-data);font-weight:600}
.rm{color:var(--danger)}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.totals div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.totals div span:first-child{color:var(--muted)}
.totals .grand{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.totals .grand span:first-child{color:var(--fg)}
.pay-add{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
@media (max-width:420px){ .pay-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .pay-add .f:last-child{grid-column:1 / -1} }
.no-gst .gst-only{display:none !important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom, 0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 14px var(--shadow)}
@media (prefers-reduced-motion: no-preference){ dialog.sheet[open]{animation:rise .18s ease-out} @keyframes rise{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<header class="appbar">
  <span class="mark" id="mark" aria-hidden="true"></span>
  <div class="appbar-t"><h1 id="title">Today</h1><small>Debug Networks</small></div>
</header>
<main id="view"><p class="empty">Opening your records…</p></main>
<button class="fab" type="button" data-act="new" aria-label="New quote, job or client"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="bottomnav" aria-label="Sections">
  <button class="navbtn" type="button" data-view="today"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg></span>Today</button>
  <button class="navbtn" type="button" data-view="jobs"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 4.5v-1h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg></span>Jobs</button>
  <button class="navbtn" type="button" data-view="clients"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.6 3.4-6 7-6s6.4 2.4 7 6"/></svg></span>Clients</button>
  <button class="navbtn" type="button" data-view="goal"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5.5-5.5 4 3.5L20 9"/><path d="M15 9h5v5"/></svg></span>Goal</button>
  <button class="navbtn" type="button" data-view="settings"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>Settings</button>
</nav>
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div id="sheetBody"></div></dialog>
<input type="file" id="restoreFile" accept=".txt,.json,text/plain,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" async></script>

  /* ---------- sharing files and text ---------- */
  function safeName(s){ return String(s || '').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'customer'; }
  function downloadBlob(blob, name){
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    toast('Saved to your phone’s Downloads.');
  }
  function blobToBase64(blob){ return new Promise(function(resolve, reject){ var fr = new FileReader(); fr.onload = function(){ resolve(String(fr.result).split(',')[1] || ''); }; fr.onerror = reject; fr.readAsDataURL(blob); }); }
  async function shareFile(blob, name, text){
    if (NATIVE){
      try { NATIVE.shareFile(await blobToBase64(blob), name, blob.type || 'application/octet-stream', text || ''); return true; }
      catch(e){ toast('Could not share the file. Try again.'); return false; }
    }
    var file = null; try { file = new File([blob], name, { type:blob.type }); } catch(e){}
    if (file && navigator.canShare && navigator.canShare({ files:[file] })){
      try { await navigator.share({ files:[file], title:name, text:text || '' }); return true; }
      catch(e){ if (e && e.name === 'AbortError') return false; }
    }
    downloadBlob(blob, name); return true;
  }
  function shareText(text){
    if (NATIVE){ NATIVE.shareText(text); return; }
    if (navigator.share){ navigator.share({ text:text }).catch(function(e){ if (!e || e.name !== 'AbortError') copy(text); }); }
    else copy(text);
  }
  function copy(text){
    if (NATIVE){ NATIVE.copyText(text); toast('Copied.'); return; }
    try { navigator.clipboard.writeText(text).then(function(){ toast('Copied.'); }, function(){ openSheet({ mode:'copy', text:text }); }); }
    catch(e){ openSheet({ mode:'copy', text:text }); }
  }
  function openWa(phone, text){ var w = waLink(phone, text); if (w){ if (NATIVE) NATIVE.openExternal(w); else window.open(w, '_blank', 'noopener'); return true; } copy(text); return false; }

      '<label class="f"><span>Quote number</span><input id="qNo" type="text" class="num" value="' + esc(d.no) + '"></label>' +
      '<label class="f"><span>Date</span><input id="qDate" type="date" value="' + esc(d.date) + '"></label>' +
      '<label class="f"><span>Valid for (days)</span><input id="qValid" type="number" inputmode="numeric" min="0" step="1" value="' + esc(d.validDays) + '"></label>' +
      '<label class="f"><span>Discount (₹)</span><input id="qDisc" type="number" inputmode="decimal" min="0" step="any" value="' + esc(d.discount) + '"></label></div>' +
      '<div><p class="section-h" style="margin-bottom:8px">Start from a kit</p><div class="chips">' + Object.keys(KITS).map(function(k){ return '<button class="chip" type="button" data-act="kit" data-kit="' + esc(k) + '">' + esc(k) + '</button>'; }).join('') + '</div></div>' +
      '<div id="qItems" style="display:flex;flex-direction:column;gap:10px"></div>' +
      '<div><p class="section-h" style="margin-bottom:8px">Add an item (your rates)</p><div class="chips" style="flex-wrap:wrap">' + Object.keys(ITEMS).map(function(k){ return '<button class="chip" type="button" data-act="qadd" data-item="' + k + '">+ ' + esc(ITEMS[k][0]) + '</button>'; }).join('') + '<button class="chip" type="button" data-act="qadd" data-item="">+ Blank item</button></div></div>' +
      '<label class="check"><input id="qGst" type="checkbox"' + (d.withGst ? ' checked' : '') + '><span>Add GST to this quote</span></label>' +
      '<p class="msg" id="qGstWarn"' + (d.withGst && !biz().gstin ? '' : ' hidden') + '>Only a business with a GST number can charge GST, and your GSTIN is empty in Settings. Untick this unless you have a GST number.</p>' +
      '<label class="check gst-only"><input id="qInter" type="checkbox"' + (d.interstate ? ' checked' : '') + '><span>Customer is in another state (IGST instead of CGST + SGST)</span></label>' +
      '<div class="totals" id="qTotals"></div>' +
      '<label class="f"><span>Terms (one per line)</span><textarea id="qTerms" rows="4">' + esc(d.terms) + '</textarea></label>' +
      '<p class="msg" id="qMsg" role="alert" hidden></p></div>' +
      '<div class="sheet-actions"><button class="btn btn-primary" type="button" data-act="q-save">Save</button><button class="btn btn-go" type="button" data-act="q-pdf">' + ICON.share + 'Share PDF</button><button class="btn" type="button" data-act="q-text">' + ICON.chat + 'As text</button></div>';
    renderQItems(); renderQTotals();
  }
  function renderQItems(){
    var d = state.sheet.draft, box = $('qItems'); if (!box) return;
    box.innerHTML = d.items.length ? d.items.map(function(it){
      var u = it.uid, at = ' data-qi="' + u + '"';
      return '<div class="qitem"><label class="f"><span>Item</span><input id="qi-d-' + u + '" type="text"' + at + ' data-k="desc" value="' + esc(it.desc) + '" autocomplete="off"></label><div class="qnums">' +
        '<label class="f"><span>Qty</span><input id="qi-q-' + u + '" type="number" min="0" step="any" inputmode="decimal"' + at + ' data-k="qty" value="' + esc(it.qty) + '"></label>' +
        '<label class="f"><span>Unit</span><select id="qi-u-' + u + '"' + at + ' data-k="unit">' + UNITS.concat(UNITS.indexOf(it.unit) < 0 ? [it.unit] : []).map(function(x){ return '<option' + (x === it.unit ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></label>' +
        '<label class="f"><span>Rate (₹)</span><input id="qi-r-' + u + '" type="number" min="0" step="any" inputmode="decimal"' + at + ' data-k="rate" value="' + esc(it.rate) + '"></label></div>' +
        '<div class="qfoot"><label class="f gst-only" style="flex:0 0 96px"><span>GST %</span><input id="qi-g-' + u + '" type="number" min="0" max="100" step="any" inputmode="decimal"' + at + ' data-k="gst" value="' + esc(it.gst) + '"></label>' +
        '<output id="qi-a-' + u + '"></output><button class="btn rm" type="button" data-act="qrm" data-qi="' + u + '" aria-label="Remove this item">Remove</button></div></div>';
    }).join('') : '<p class="empty">No items yet. Start from a kit above, or add items one by one.</p>';
  }
  function renderQTotals(){
    var d = state.sheet.draft, c = calcQuote(d);
    c.lines.forEach(function(l){ var o = $('qi-a-' + l.uid); if (o) o.textContent = '₹' + fmt2(l.amount); });
    var box = $('qTotals'); if (!box) return;
    box.innerHTML = totalRows(c, d).map(function(r){ return '<div><span>' + r[0] + '</span><span class="num">' + r[1] + '</span></div>'; }).join('') +
      '<div class="grand"><span>Total</span><span class="num">₹' + fmt2(c.total) + '</span></div><div><span>In words</span><span style="text-align:right">Rupees ' + inWords(c.total) + ' Only</span></div>';
    var saved = d.jobId ? state.jobs.find(function(x){ return x.id === d.jobId; }) : null;
    if (saved && saved.quote && Math.round(num(saved.amount)) !== c.total) box.innerHTML += '<p class="hint">This quote was saved at ₹' + fmt2(num(saved.amount)) + '. Saving now changes the job total to ₹' + fmt2(c.total) + '.</p>';
  }
  function saveQuote(){
    var d = state.sheet.draft, msg = $('qMsg'), show = function(t){ msg.textContent = t; msg.hidden = false; msg.scrollIntoView({ block:'center' }); return null; };
    if (!d.clientId) return show('Choose a client, or pick "+ Add a new client".');
    if (d.clientId === '__new' && !d.ncName.trim()) return show('Enter the new client’s name.');
    var c = calcQuote(d);
    if (!printable(c).length) return show('Add at least one item.');
    msg.hidden = true;
    var cid = d.clientId;
    if (cid === '__new'){ var nc = { id:uid('c'), name:d.ncName.trim(), phone:d.ncPhone.trim(), type:'Shop', area:'', notes:'', createdAt:new Date().toISOString() }; if (!putClient(nc)) return null; cid = nc.id; d.clientId = cid; d.ncName = ''; }
    var old = d.jobId ? state.jobs.find(function(x){ return x.id === d.jobId; }) : null;
    var quote = { no:d.no.trim(), date:d.date, validDays:d.validDays, items:d.items.map(function(i){ return { desc:i.desc, qty:i.qty, unit:i.unit, rate:i.rate, gst:i.gst }; }), discount:d.discount, interstate:!!d.interstate, withGst:!!d.withGst, terms:d.terms };
    var title = d.title.trim() || (printable(c)[0] ? printable(c)[0].desc : 'CCTV work');
    var j = old ? clone(old) : { id:uid('j'), clientId:cid, status:'Quote sent', cost:'', workDate:'', followUp:addDays(d.date || today(), 2), amcUntil:'', warrantyUntil:'', notes:'', payments:[], createdAt:new Date().toISOString() };
    j.clientId = cid; j.title = title; j.quote = quote; j.quoteNo = quote.no; j.date = quote.date; j.amount = c.total;
    if (!putJob(j)) return null;
    d.jobId = j.id;
    var tail = parseInt((quote.no.match(/(\d+)\s*$/) || [])[1], 10);
    if (isFinite(tail) && tail >= num(state.settings.nextNo)){ state.settings.nextNo = tail + 1; persist(); }
    var sel = $('qClient'); if (sel) sel.innerHTML = clientOptions(d.clientId);
    var nw = $('qNew'); if (nw) nw.hidden = true;
    var ht = $('sheetTitle'); if (ht) ht.textContent = 'Quote ' + quote.no;
    render(); toast('Quote ' + quote.no + ' saved.');
    return j;
  }

  /* ---------- form saves ---------- */
  function saveClientForm(e){
    e.preventDefault();
    var name = $('cfName').value.trim(), msg = $('cfMsg');
    if (!name){ msg.textContent = 'Enter the client or shop name.'; msg.hidden = false; return; }
    var old = state.sheet.id ? state.clients.find(function(x){ return x.id === state.sheet.id; }) : null;
    var c = { id:old ? old.id : uid('c'), name:name, phone:$('cfPhone').value.trim(), type:$('cfType').value, area:$('cfArea').value.trim(), notes:$('cfNotes').value.trim(), createdAt:old ? old.createdAt : new Date().toISOString() };
    if (putClient(c)){ toast(old ? 'Client updated.' : name + ' added.'); render(); openSheet({ mode:'client', id:c.id }); }
  }
  function saveJobForm(e){
    e.preventDefault();
    var msg = $('jfMsg'), cid = $('jfClient').value, show = function(t){ msg.textContent = t; msg.hidden = false; };
    if (!cid) return show('Choose a client, or pick "+ Add a new client".');
    if (cid === '__new' && !$('jfNcName').value.trim()) return show('Enter the new client’s name.');
    if (!$('jfTitle').value.trim()) return show('Describe the work, for example "4 HD cameras with DVR".');
    var old = state.sheet.id ? state.jobs.find(function(x){ return x.id === state.sheet.id; }) : null;
    if (cid === '__new'){ var nc = { id:uid('c'), name:$('jfNcName').value.trim(), phone:$('jfNcPhone').value.trim(), type:'Shop', area:'', notes:'', createdAt:new Date().toISOString() }; if (!putClient(nc)) return; cid = nc.id; }
    var j = old ? clone(old) : { id:uid('j'), payments:[], quote:null, quoteNo:'', createdAt:new Date().toISOString() };
    j.clientId = cid; j.title = $('jfTitle').value.trim(); j.status = $('jfStatus').value; if (!j.quote) j.amount = num($('jfAmount').value);
    j.cost = num($('jfCost').value); j.date = $('jfDate').value; j.workDate = $('jfWork').value; j.followUp = $('jfFollow').value;
    j.warrantyUntil = $('jfWarranty').value; j.amcUntil = $('jfAmc').value; j.notes = $('jfNotes').value.trim();
    if (putJob(j)){ toast(old ? 'Job updated.' : 'Job added.'); render(); closeSheet(); }
  }
  function saveSettingsForm(e){
    e.preventDefault();
    var s = clone(state.settings);
    s.biz = Object.assign({}, s.biz, { name:$('sName').value.trim() || 'Debug Networks', tagline:$('sTag').value.trim(), phone:$('sPhone').value.trim(), upi:$('sUpi').value.trim(), email:$('sEmail').value.trim(), address:$('sAddr').value.trim(), gstRegistered:$('sGst').checked, gstin:$('sGstin').value.trim(), logo:$('sLogo').value, appLink:$('sApp').value.trim() });
    s.nextNo = Math.max(1, Math.round(num($('sNext').value)) || 1); s.terms = $('sTerms').value;
    s.goal = { amount:Math.max(1, num($('gAmt').value)) || 100000, start:$('gStart').value || DEFAULT_SETTINGS.goal.start, end:$('gEnd').value || DEFAULT_SETTINGS.goal.end };
    var prev = state.settings; state.settings = s;
    if (persist()){ toast('Settings saved.'); render(true); } else state.settings = prev;
  }
  function addPayment(jobId){
    var j = state.jobs.find(function(x){ return x.id === jobId; }); if (!j) return;
    var amt = num($('paAmount').value); if (amt <= 0){ toast('Enter the amount received.'); return; }
    var p = { id:uid('p'), amount:amt, date:$('paDate').value || today(), mode:$('paMode').value, note:$('paNote') ? $('paNote').value.trim() : '' };
    var nj = clone(j); nj.payments = (nj.payments || []).concat([p]);
    if (putJob(nj)){ toast(rupees(amt) + ' payment saved.'); render(); if (state.sheet && state.sheet.mode === 'job') renderSheet(); else closeSheet(); }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', async function(e){
    var b = e.target.closest('[data-act], [data-view], [data-jobs-tab]'); if (!b) return;
    if (b.dataset.view){ setView(b.dataset.view); return; }
    if (b.dataset.jobsTab){ state.jobsTab = b.dataset.jobsTab; setView('jobs'); return; }
    var act = b.dataset.act, id = b.dataset.id, j = id ? state.jobs.find(function(x){ return x.id === id; }) : null;
    if (act === 'close') return closeSheet();
    if (act === 'new') return openSheet({ mode:'new' });
    if (act === 'new-client') return openSheet({ mode:'client-form' });
    if (act === 'new-job') return openSheet({ mode:'job', clientId:b.dataset.client || '' });
    if (act === 'new-quote') return openSheet({ mode:'quote', draft:newDraft(b.dataset.client || '') });
    if (act === 'client') return openSheet({ mode:'client', id:id });
    if (act === 'edit-client') return openSheet({ mode:'client-form', id:id });
    if (act === 'job') return openSheet({ mode:'job', id:id });
    if (act === 'edit-quote' && j) return openSheet({ mode:'quote', draft:draftFromJob(j) });
    if (act === 'pay') return openSheet({ mode:'pay', id:id });
    if (act === 'add-pay') return addPayment(id);
    if (act === 'msg-pay' && j) return copy(msgPayment(j));
    if (act === 'msg-quote' && j) return copy(msgQuote(j));
    if (act === 'msg-amc' && j) return copy(msgAmc(j));
    if (act === 'card-text' && j) return openWa(clientOf(j).phone, cardText(j));
    if (act === 'share-app') return shareText(shareMsg());
    if (act === 'backup') return backupNow();
    if (act === 'restore'){ $('restoreFile').value = ''; $('restoreFile').click(); return; }
    if (act === 'do-restore' && state.sheet && state.sheet.data){
      var d = state.sheet.data; applyData(d); state.meta.lastBackup = (d.exportedAt || '').slice(0, 10);
      if (persist()){ closeSheet(); state.view = 'today'; render(true); toast('Restored ' + state.clients.length + ' clients and ' + state.jobs.length + ' jobs.'); }
      return;
    }
    if (act === 'install' && installEvt){ var ev = installEvt; installEvt = null; ev.prompt(); try { await ev.userChoice; } catch(_){} render(true); return; }
    if (act === 'card' && j){ b.disabled = true; var blob = await buildCard(j); b.disabled = false; if (blob) await shareFile(blob, 'CCTV-card-' + safeName(clientOf(j).name) + '.png', 'Your CCTV card from ' + biz().name); return; }
    if (act === 'status' && j){
      var nj = clone(j); nj.status = b.dataset.to; if (nj.status === 'Confirmed' || nj.status === 'Lost') nj.followUp = '';
      if ((nj.status === 'In progress' || nj.status === 'Done') && !nj.workDate) nj.workDate = today();
      if (putJob(nj)){ toast(clientOf(j).name + ': ' + nj.status + '.' + (nj.status === 'Done' ? ' Open the job to share the CCTV card.' : '')); render(); }
      return;
    }
    if (act === 'followed' && j){ var fj = clone(j); fj.followUp = ''; if (putJob(fj)){ toast('Follow-up cleared.'); render(); } return; }
    if (act === 'del-pay'){ armed(b, 'Tap again to remove', function(){ var pj = state.jobs.find(function(x){ return x.id === id; }); if (!pj) return; var n2 = clone(pj); n2.payments = (n2.payments || []).filter(function(p){ return p.id !== b.dataset.pid; }); if (putJob(n2)){ toast('Payment removed.'); render(); renderSheet(); } }); return; }
    if (act === 'del-job'){ armed(b, 'Tap again to delete', function(){ if (removeJob(id)){ toast('Job deleted.'); render(); closeSheet(); } }); return; }
    if (act === 'del-client'){ armed(b, 'Tap again to delete', function(){ if (removeClient(id)){ toast('Client deleted.'); render(); closeSheet(); } }); return; }
    if (state.sheet && state.sheet.mode === 'quote'){
      var dq = state.sheet.draft;
      if (act === 'kit'){ dq.items = KITS[b.dataset.kit].map(function(p){ return qItem(p[0], p[1]); }); if (!dq.title) dq.title = b.dataset.kit; var qt = $('qTitle'); if (qt && !qt.value) qt.value = dq.title; renderQItems(); renderQTotals(); return; }
      if (act === 'qadd'){ var it = b.dataset.item ? qItem(b.dataset.item, 1) : { uid:uid('i'), desc:'', qty:'1', unit:'Nos', rate:'', gst:'18' }; dq.items.push(it); renderQItems(); renderQTotals(); var f = $('qi-' + (b.dataset.item ? 'q' : 'd') + '-' + it.uid); if (f){ f.scrollIntoView({ block:'center' }); f.focus(); } return; }
      if (act === 'qrm'){ dq.items = dq.items.filter(function(i){ return i.uid !== b.dataset.qi; }); renderQItems(); renderQTotals(); return; }
      if (act === 'q-save'){ saveQuote(); return; }
      if (act === 'q-text'){ var c0 = calcQuote(dq); if (!printable(c0).length){ toast('Add at least one item first.'); return; } var cl = draftClient(dq); openWa(cl.phone, quoteText(dq, cl)); return; }
      if (act === 'q-pdf'){
        if (!window.jspdf){ toast('The PDF maker needs the internet once. Connect, reopen the app, then try again.'); return; }
        var saved = saveQuote(); if (!saved) return;
        b.disabled = true;
        try { var doc = await buildPdf(saved.quote, clientOf(saved)); await shareFile(doc.output('blob'), 'Quotation-' + safeName(saved.quoteNo) + '-' + safeName(clientOf(saved).name) + '.pdf', 'Quotation ' + saved.quoteNo + ' from ' + biz().name); }
        catch(err){ toast('Could not make the PDF. Try again.'); }
        b.disabled = false; return;
      }
    }
  });
  document.addEventListener('submit', function(e){
    if (e.target.id === 'clientForm') saveClientForm(e);
    else if (e.target.id === 'jobForm') saveJobForm(e);
    else if (e.target.id === 'settingsForm') saveSettingsForm(e);
  });
  document.addEventListener('input', function(e){
    var t = e.target;
    if (t.id === 'q'){ state.q = t.value; var pos = t.selectionStart; render(true); var q = $('q'); if (q){ q.focus(); try { q.setSelectionRange(pos, pos); } catch(_){} } return; }
    if (state.sheet && state.sheet.mode === 'quote'){
      var d = state.sheet.draft;
      if (t.dataset.qi){ var it = d.items.find(function(i){ return i.uid === t.dataset.qi; }); if (it){ it[t.dataset.k] = t.value; renderQTotals(); } return; }
      var map = { qTitle:'title', qNo:'no', qDate:'date', qValid:'validDays', qDisc:'discount', qTerms:'terms', qNcName:'ncName', qNcPhone:'ncPhone' };
      if (map[t.id]){ d[map[t.id]] = t.value; if (t.id === 'qDisc') renderQTotals(); }
    }
  });
  document.addEventListener('change', function(e){
    var t = e.target;
    if (t.id === 'restoreFile'){ onRestoreFile(t.files && t.files[0]); return; }
    if (t.id === 'sf'){ state.statusFilter = t.value; render(true); }
    if (t.id === 'jfClient'){ $('jfNew').hidden = t.value !== '__new'; }
    if (state.sheet && state.sheet.mode === 'quote'){
      var d = state.sheet.draft;
      if (t.id === 'qClient'){ d.clientId = t.value; $('qNew').hidden = t.value !== '__new'; }
      if (t.id === 'qInter'){ d.interstate = t.checked; renderQTotals(); }
      if (t.id === 'qGst'){ d.withGst = t.checked; $('sheetBody').classList.toggle('no-gst', !d.withGst); $('qGstWarn').hidden = !(d.withGst && !biz().gstin); renderQTotals(); }
      if (t.dataset.qi && t.tagName === 'SELECT'){ var it = d.items.find(function(i){ return i.uid === t.dataset.qi; }); if (it) it.unit = t.value; }
    }
  });
  $('sheet').addEventListener('cancel', function(e){ e.preventDefault(); closeSheet(); });
  $('sheet').addEventListener('click', function(e){ if (e.target === $('sheet')) closeSheet(); });
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); installEvt = e; if (state.view === 'today') render(true); });
  window.addEventListener('appinstalled', function(){ installEvt = null; toast('DN Office is installed. Open it from your home screen.'); if (state.view === 'today') render(true); });
  window.__dn = { state:state, calcQuote:calcQuote, buildPdf:buildPdf, buildCard:buildCard, backupData:backupData };

  /* ---------- start ---------- */
  load();
  var params = new URLSearchParams(location.search);
  if (params.get('tab') === 'money'){ state.view = 'jobs'; state.jobsTab = 'money'; }
  render(true);
  if (state.view !== 'today') guard();
  if (params.get('new') === 'quote') openSheet({ mode:'quote', draft:newDraft('') });
  if (location.search) history.replaceState(history.state, '', location.pathname);
  if (NATIVE) state.persisted = true;
  else if (navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(function(p){ return p || navigator.storage.persist(); }).then(function(p){ state.persisted = !!p; if (state.view === 'settings') render(true); }).catch(function(){ state.persisted = false; });
  } else state.persisted = false;
  if (!NATIVE && 'serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
