name: DN Office APK

on:
  push:
    branches: [dn-office]
    paths:
      - 'dn-office/**'
      - '.github/workflows/dn-office-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dn-office-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash dn-office/android/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Try the APK on an Android 14 emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash dn-office/android/smoke-test.sh

      - name: Publish the results to the dn-office-build branch
        if: always()
        run: |
          mkdir -p /tmp/publish
          cp -r dn-office/out/. /tmp/publish/ 2>/dev/null || echo "no build output" > /tmp/publish/NO_OUTPUT.txt
          echo "run ${{ github.run_number }} of ${{ github.sha }} (${{ job.status }})" > /tmp/publish/RUN.txt
          cd /tmp/publish
          git init -q -b dn-office-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "DN Office build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dn-office-build
